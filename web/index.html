<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisor de Ofertas vs CVs</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a22; --panel2:#1c212b; --line:#2a3040;
    --text:#e6e9ef; --dim:#98a2b3; --accent:#4c8dff; --accent2:#7c5cff;
    --ok:#2fbf71; --warn:#f2b544; --err:#ef5f5f;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* ---------- layout ---------- */
  header{
    display:flex; align-items:center; gap:16px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  header h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.2px}
  header h1 span{color:var(--dim); font-weight:400}
  .stats{margin-left:auto; display:flex; gap:14px; color:var(--dim); font-size:12px}
  .stats b{color:var(--text)}
  main{display:flex; height:calc(100vh - 49px)}

  /* ---------- lista lateral ---------- */
  #sidebar{
    width:330px; flex:0 0 330px; background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
  }
  #search-wrap{padding:10px; border-bottom:1px solid var(--line)}
  #search{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:13px; outline:none;
  }
  #search:focus{border-color:var(--accent)}
  .filters{display:flex; gap:12px; align-items:center; margin-top:8px; font-size:12px; color:var(--dim)}
  .filters label{cursor:pointer; user-select:none}
  #job-list{overflow-y:auto; flex:1}
  .job{
    padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer;
    border-left:3px solid transparent;
  }
  .job:hover{background:var(--panel2)}
  .job.active{background:var(--panel2); border-left-color:var(--accent)}
  .job .t{font-weight:600; font-size:13px; line-height:1.35; margin-bottom:2px}
  .job .m{font-size:11.5px; color:var(--dim); display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .job .id{font-family:ui-monospace,monospace; color:var(--accent); opacity:.85}
  .badge{
    display:inline-block; font-size:10px; padding:1px 6px; border-radius:20px;
    border:1px solid var(--line); color:var(--dim); white-space:nowrap;
  }
  .badge.ok{color:var(--ok); border-color:rgba(47,191,113,.4)}
  .badge.no{color:var(--warn); border-color:rgba(242,181,68,.35)}

  /* ---------- panes ---------- */
  #content{flex:1; display:flex; min-width:0}
  .pane{
    flex:1 1 50%; min-width:0; display:flex; flex-direction:column;
    border-right:1px solid var(--line);
  }
  .pane:last-child{border-right:none}
  .pane-head{
    padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; flex:0 0 auto; min-height:46px;
  }
  .pane-head h2{font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin:0; font-weight:600}
  .pane-head .title{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pane-head .spacer{flex:1}
  .pill{
    font-size:11px; padding:2px 8px; border-radius:20px;
    background:rgba(76,141,255,.14); color:#a9c8ff; border:1px solid rgba(76,141,255,.3);
    white-space:nowrap;
  }
  .pill.empresa{background:rgba(124,92,255,.14); color:#c3b5ff; border-color:rgba(124,92,255,.32)}
  .btn{
    font-size:11.5px; color:var(--dim); text-decoration:none; border:1px solid var(--line);
    padding:4px 9px; border-radius:6px; background:var(--panel2); cursor:pointer;
  }
  .btn:hover{color:var(--text); border-color:var(--accent)}
  .pane-body{overflow-y:auto; padding:16px 18px 60px; flex:1}

  /* ---------- contenido oferta ---------- */
  .meta-grid{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12.5px; margin-bottom:18px}
  .meta-grid dt{color:var(--dim)}
  .meta-grid dd{margin:0; word-break:break-word}
  .offer h3{
    font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--accent);
    margin:20px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line);
  }
  .offer pre{
    white-space:pre-wrap; word-wrap:break-word; font-size:12.8px; line-height:1.65;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin:0; color:#dfe4ec;
  }
  .offer a{color:var(--accent)}

  /* ---------- contenido CV (markdown renderizado) ---------- */
  .md{font-size:13.6px; line-height:1.68}
  .md h1{font-size:20px; margin:.2em 0 .5em; padding-bottom:.25em; border-bottom:1px solid var(--line)}
  .md h2{font-size:16px; margin:1.2em 0 .5em; color:#dbe3f0}
  .md h3{font-size:14px; margin:1em 0 .4em; color:#cdd6e4}
  .md h4,.md h5,.md h6{font-size:13px; margin:.9em 0 .3em; color:#c2ccdb}
  .md p{margin:.55em 0}
  .md ul,.md ol{margin:.5em 0 .5em 1.2em; padding:0}
  .md li{margin:.22em 0}
  .md hr{border:0; border-top:1px solid var(--line); margin:1.2em 0}
  .md code{background:var(--panel2); padding:1px 5px; border-radius:4px; font-size:12.5px}
  .md strong{color:#fff}
  .md blockquote{
    border-left:3px solid var(--warn); background:rgba(242,181,68,.08);
    padding:8px 12px; margin:10px 0; border-radius:0 8px 8px 0; color:#f6d9a5;
  }
  .md table{border-collapse:collapse; margin:10px 0}
  .md td,.md th{border:1px solid var(--line); padding:5px 9px; font-size:12.5px}

  .warn-box{
    background:rgba(242,181,68,.09); border:1px solid rgba(242,181,68,.35);
    color:#f6d9a5; border-radius:var(--radius); padding:10px 12px; margin:0 0 14px; font-size:12.5px;
  }
  .warn-box b{color:#ffd98a}
  #cv-frame{
    width:100%; height:100%; min-height:calc(100vh - 130px); border:0;
    background:#eef1f6; border-radius:8px;
  }
  .empty{color:var(--dim); text-align:center; padding:60px 20px; font-size:13px}
  .tabs{display:flex; gap:6px; align-items:center}
  .tab{
    font-size:11.5px; padding:4px 10px; border-radius:6px; border:1px solid var(--line);
    color:var(--dim); cursor:pointer; background:var(--panel2);
    text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
  }
  .tab:hover{color:var(--text); border-color:var(--accent)}
  .tab.active{color:var(--text); border-color:var(--accent); background:rgba(76,141,255,.14); font-weight:600}
  .hidden{display:none !important}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2b3240;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <h1>Revisor de ofertas <span>· empleos_santiago</span></h1>
  <div class="stats" id="stats"></div>
</header>

<main>
  <aside id="sidebar">
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Buscar por cargo, empresa o id…  (/)" autocomplete="off">
      <div class="filters">
        <label><input type="checkbox" id="only-cv"> solo con CV</label>
        <label><input type="checkbox" id="hide-empty"> ocultar sin CV</label>
        <span id="count" style="margin-left:auto"></span>
      </div>
    </div>
    <div id="job-list"></div>
  </aside>

  <section id="content">
    <div class="pane" id="pane-offer">
      <div class="pane-head">
        <h2>Oferta original</h2>
        <div class="title" id="offer-title"></div>
        <div class="spacer"></div>
        <span class="pill empresa" id="offer-company"></span>
      </div>
      <div class="pane-body" id="offer-body">
        <div class="empty">Selecciona una oferta de la lista.</div>
      </div>
    </div>

    <div class="pane" id="pane-cv">
      <div class="pane-head">
        <h2>CV generado</h2>
        <div class="title" id="cv-title"></div>
        <span class="pill" id="cv-tokens" title="Tokens consumidos por el LLM al generar este CV"></span>
        <div class="spacer"></div>
        <div class="tabs" id="cv-actions">
          <button class="tab active" id="btn-view-html" type="button">HTML</button>
          <button class="tab" id="btn-view-md" type="button">MD</button>
          <a class="tab" id="btn-download-pdf" href="#" download title="Descargar como PDF">PDF</a>
        </div>
      </div>
      <div class="pane-body" id="cv-body">
        <div class="empty">Selecciona una oferta de la lista.</div>
      </div>
    </div>
  </section>
</main>

<script>
/* ------------------------------------------------------------------ */
/* Renderizador de Markdown mínimo (sin dependencias externas)        */
/* ------------------------------------------------------------------ */
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function inline(s){
  return escapeHtml(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(md){
  const lines = md.replace(/\r/g,'').split('\n');
  let out='', list=null, inCode=false, codeBuf=[];
  const closeList=()=>{ if(list){ out+='</'+list+'>'; list=null; } };
  const flushCode=()=>{ out+='<pre><code>'+escapeHtml(codeBuf.join('\n'))+'</code></pre>'; codeBuf=[]; };

  for(const raw of lines){
    if(raw.trim().startsWith('```')){
      if(inCode){ flushCode(); inCode=false; } else { closeList(); inCode=true; }
      continue;
    }
    if(inCode){ codeBuf.push(raw); continue; }

    const line = raw.replace(/\s+$/,'');
    const t = line.trim();

    if(t===''){ closeList(); continue; }
    if(/^<[a-zA-Z!]/.test(t)){ closeList(); out+=t; continue; }  // HTML (comentarios de auditoría)

    const h = t.match(/^(#{1,6})\s+(.*)$/);
    if(h){ closeList(); out+='<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>'; continue; }

    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ closeList(); out+='<hr>'; continue; }

    const ul = t.match(/^[-*+]\s+(.*)$/);
    if(ul){ if(list!=='ul'){ closeList(); out+='<ul>'; list='ul'; } out+='<li>'+inline(ul[1])+'</li>'; continue; }

    const ol = t.match(/^\d+[.)]\s+(.*)$/);
    if(ol){ if(list!=='ol'){ closeList(); out+='<ol>'; list='ol'; } out+='<li>'+inline(ol[1])+'</li>'; continue; }

    const q = t.match(/^>\s?(.*)$/);
    if(q){ closeList(); out+='<blockquote>'+inline(q[1])+'</blockquote>'; continue; }

    closeList();
    out+='<p>'+inline(line)+'</p>';
  }
  closeList(); if(inCode) flushCode();
  return out;
}

/* Extrae y muestra aparte el comentario de auditoría que agent.py deja
   al final del CV cuando el auditor detecta problemas. */
function splitAudit(md){
  const m = md.match(/<!--\s*REVISAR MANUALMENTE:([\s\S]*?)-->/i);
  if(!m) return {text:md, audit:null};
  return {text:md.replace(m[0],''), audit:m[1].trim()};
}

/* ------------------------------------------------------------------ */
/* Estado y carga de datos                                             */
/* ------------------------------------------------------------------ */
const S = { jobs:[], current:null, currentCv:null, filterText:'', onlyCv:false, hideEmpty:false,
            view:'html', cvFile:null, canPdf:false };

const $ = s => document.querySelector(s);

async function api(url){
  const r = await fetch(url);
  if(!r.ok){
    let msg = r.statusText;
    try{ msg = (await r.json()).error || msg; }catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

async function loadJobs(){
  const params = new URLSearchParams();
  if(S.filterText) params.set('q', S.filterText);
  const data = await api('/api/jobs?'+params.toString());
  S.jobs = data.jobs;
  $('#stats').innerHTML =
    `<span>ofertas <b>${data.stats.total}</b></span>` +
    `<span>con CV <b>${data.stats.con_cv}</b></span>` +
    `<span>sin CV <b>${data.stats.sin_cv}</b></span>` +
    `<span>archivos <b>${data.stats.archivos_cv}</b></span>` +
    (data.stats.tokens_total ? `<span>tokens <b>${data.stats.tokens_total.toLocaleString('es-CL')}</b></span>` : '');
  renderList();
}

function renderList(){
  const list = $('#job-list');
  list.innerHTML='';
  const jobs = S.jobs.filter(j => (S.hideEmpty ? j.has_cv : true));
  $('#count').textContent = jobs.length + ' de ' + S.jobs.length;

  if(!jobs.length){
    list.innerHTML = '<div class="empty">Sin resultados.</div>';
    return;
  }
  for(const j of jobs){
    const el = document.createElement('div');
    el.className = 'job' + (S.current && S.current.id===j.id ? ' active' : '');
    el.dataset.id = j.id;
    el.innerHTML =
      `<div class="t"></div>` +
      `<div class="m"><span class="id"></span>` +
      `<span class="badge ${j.has_cv?'ok':'no'}">${j.has_cv?'CV ✓':'sin CV'}</span></div>` +
      `<div class="m"><span class="cmp"></span><span class="loc"></span></div>`;
    el.querySelector('.t').textContent = j.title;
    el.querySelector('.id').textContent = j.id;
    el.querySelector('.cmp').textContent = j.company || '—';
    el.querySelector('.loc').textContent = j.location ? '· '+j.location : '';
    el.addEventListener('click', ()=> selectJob(j.id));
    list.appendChild(el);
  }
}

async function selectJob(id){
  S.current = {id};
  renderList();
  $('#offer-title').textContent = 'cargando…';
  $('#cv-body').innerHTML = '<div class="empty">Cargando CV…</div>';

  let data;
  try{ data = await api('/api/job/'+encodeURIComponent(id)); }
  catch(e){ $('#offer-body').innerHTML = '<div class="empty">Error: '+escapeHtml(e.message)+'</div>'; return; }

  S.current = data;
  S.canPdf = !!data.can_pdf;
  renderList();
  renderOffer(data);
  await renderCv(data);
  renderTokens(data.tokens);
  history.replaceState(null,'','#'+id);
}

function renderOffer(d){
  $('#offer-title').textContent = d.title;
  $('#offer-company').textContent = d.company || 'empresa desconocida';
  const body = $('#offer-body');
  let html = '<dl class="meta-grid">';
  for(const m of d.meta){
    html += '<dt>'+escapeHtml(m.label)+'</dt><dd>'+escapeHtml(String(m.value))+'</dd>';
  }
  html += '</dl>';
  if(d.url){
    html += '<div style="margin-bottom:6px"><a href="'+escapeHtml(d.url)+'" target="_blank" rel="noopener">🔗 Ver oferta en LinkedIn</a></div>';
  }
  html += '<div class="offer">';
  for(const s of d.sections){
    html += '<h3>'+escapeHtml(s.label)+'</h3><pre>'+escapeHtml(s.value)+'</pre>';
  }
  html += '</div>';
  body.innerHTML = html;
}

async function renderCv(d){
  const actions = $('#cv-actions');
  if(!d.cvs || !d.cvs.length){
    $('#cv-title').textContent = '';
    $('#cv-body').innerHTML =
      '<div class="empty">No hay CV generado para esta oferta.<br>' +
      'Se genera con:<br><code>python agent.py --db empleos_santiago.db --table empleos ' +
      '--id-col identificador --title-col empleo --out output</code></div>';
    actions.classList.add('hidden');
    return;
  }

  actions.classList.remove('hidden');
  const master = d.cvs.find(c => c.ext === 'md') || d.cvs[0];
  S.cvFile = master.file;
  await loadCvContent(d.id, master.file);
}

function renderTokens(t){
  const el = $('#cv-tokens');
  if(!t || !t.total){
    el.classList.add('hidden');
    el.textContent = '';
    return;
  }
  el.classList.remove('hidden');
  el.textContent = `🧮 ${t.total.toLocaleString('es-CL')} tokens`;
  el.title = `LLM: ${t.model}\nentrada: ${t.input.toLocaleString('es-CL')} · ` +
             `salida: ${t.output.toLocaleString('es-CL')} · ${t.calls} llamadas` +
             (t.when ? `\n${t.when}` : '');
}

async function loadCvContent(id, file){
  const body = $('#cv-body');
  const btnHtml = $('#btn-view-html');
  const btnMd = $('#btn-view-md');
  const btnPdf = $('#btn-download-pdf');

  btnHtml.classList.toggle('active', S.view === 'html');
  btnMd.classList.toggle('active', S.view === 'md');

  const cvs = (S.current && S.current.cvs) || [];
  const htmlCv = cvs.find(c => c.ext === 'html') || cvs.find(c => c.ext === 'md') || cvs[0];
  const mdCv = cvs.find(c => c.ext === 'md');

  // Enlace de descarga en PDF
  const pdfSource = htmlCv || cvs[0];
  if(pdfSource){
    btnPdf.href = '/api/cv/' + encodeURIComponent(id) + '/' + encodeURIComponent(pdfSource.file) + '?view=pdf';
    btnPdf.setAttribute('download', pdfSource.file.replace(/\.[^.]+$/, '') + '.pdf');
  }

  if(S.view === 'html'){
    if(!htmlCv){
      body.innerHTML = '<div class="empty">No hay versión HTML disponible.</div>';
      return;
    }
    $('#cv-title').textContent = htmlCv.file;
    const htmlUrl = '/api/cv/' + encodeURIComponent(id) + '/' + encodeURIComponent(htmlCv.file) + '?view=html';
    body.innerHTML = '<iframe id="cv-frame" src="' + htmlUrl + '" title="CV en HTML"></iframe>';
    return;
  }

  // Vista Markdown
  if(!mdCv){
    $('#cv-title').textContent = (htmlCv ? htmlCv.file : '');
    body.innerHTML = '<div class="empty">Esta oferta sólo cuenta con versión HTML.<br>Haz clic en <b>HTML</b> para visualizarla.</div>';
    return;
  }

  $('#cv-title').textContent = mdCv.file;
  body.innerHTML = '<div class="empty">Cargando…</div>';
  try{
    const mdUrl = '/api/cv/' + encodeURIComponent(id) + '/' + encodeURIComponent(mdCv.file);
    const res = await fetch(mdUrl);
    if(!res.ok) throw new Error('no se pudo leer el CV');
    const text = await res.text();
    const {text:clean, audit} = splitAudit(text);
    let html = '';
    if(audit){
      html += '<div class="warn-box"><b>⚠ Auditor del agente: revisar manualmente</b><br>' +
              escapeHtml(audit).replace(/\n/g,'<br>') + '</div>';
    }
    html += '<div class="md">' + renderMarkdown(clean) + '</div>';
    body.innerHTML = html;
    body.scrollTop = 0;
  }catch(e){
    body.innerHTML = '<div class="empty">Error: ' + escapeHtml(e.message) + '</div>';
  }
}

/* Cambio de vista del CV: HTML o Markdown */
$('#btn-view-html').addEventListener('click', ()=>{
  if(S.view === 'html') return;
  S.view = 'html';
  if(S.current && S.cvFile) loadCvContent(S.current.id, S.cvFile);
});

$('#btn-view-md').addEventListener('click', ()=>{
  if(S.view === 'md') return;
  S.view = 'md';
  if(S.current && S.cvFile) loadCvContent(S.current.id, S.cvFile);
});

/* ------------------------------------------------------------------ */
/* Eventos                                                             */
/* ------------------------------------------------------------------ */
let searchTimer;
$('#search').addEventListener('input', e=>{
  S.filterText = e.target.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadJobs, 180);
});
$('#only-cv').addEventListener('change', e=>{ S.onlyCv = e.target.checked; loadJobs(); });
$('#hide-empty').addEventListener('change', e=>{ S.hideEmpty = e.target.checked; renderList(); });

document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==$('#search')){ e.preventDefault(); $('#search').focus(); return; }
  if(e.key==='Escape'){ $('#search').blur(); return; }
  if(e.key==='j'||e.key==='k'){
    if(document.activeElement===$('#search')) return;
    const ids = S.jobs.map(j=>j.id);
    const idx = ids.indexOf(S.current && S.current.id);
    const next = e.key==='j' ? Math.min(ids.length-1, idx+1) : Math.max(0, idx-1);
    if(ids[next]){ e.preventDefault(); selectJob(ids[next]); }
  }
});

/* Arranque */
loadJobs().then(()=>{
  const hash = location.hash.replace('#','');
  if(hash) selectJob(hash);
  else if(S.jobs.length) selectJob(S.jobs[0].id);
});
</script>
</body>
</html>
